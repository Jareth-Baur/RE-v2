  End

  Behavior = DestroyDie ModuleTag_03
    ;nothing
  End
  Behavior = LifetimeUpdate ModuleTag_04
    MinLifetime = 205   ; min lifetime in msec
    MaxLifetime = 205   ; max lifetime in msec
  End
End

